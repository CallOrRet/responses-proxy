name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: responses-proxy

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # linux: cross-built with zig against glibc 2.28, runs on
          # RHEL/CentOS 8, Alibaba Cloud Linux, Debian 10+, Ubuntu 18.04+
          - target: aarch64-unknown-linux-gnu
            zig_target: aarch64-unknown-linux-gnu.2.28
            os: ubuntu-latest
          - target: x86_64-unknown-linux-gnu
            zig_target: x86_64-unknown-linux-gnu.2.28
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Add target
        run: rustup target add ${{ matrix.target }}

      - name: Install cargo-zigbuild (linux)
        if: runner.os == 'Linux'
        run: pip3 install cargo-zigbuild

      - name: Show toolchain
        run: rustc -V && cargo -V

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary (linux, glibc 2.28)
        if: runner.os == 'Linux'
        run: cargo zigbuild --release --target ${{ matrix.zig_target }}

      - name: Build release binary (darwin)
        if: runner.os == 'macOS'
        run: cargo build --release --target ${{ matrix.target }}

      # zigbuild writes to target/<plain triple>/release, not <triple>.<glibc>
      - name: Verify ELF arch and max glibc symbol (linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/${BIN_NAME}"
          file "$BIN"
          MAX=$(strings -a "$BIN" \
            | grep -oE '^GLIBC_[0-9]+\.[0-9]+$' \
            | sed 's/^GLIBC_//' | sort -V -u | tail -1 || true)
          echo "highest glibc version required: ${MAX:-none}"
          if [ -n "$MAX" ]; then
            printf '%s\n2.28\n' "$MAX" | sort -V | tail -1 | grep -qx '2\.28' \
              || { echo "::error::binary requires glibc newer than 2.28"; exit 1; }
          fi

      - name: Package (unix)
        shell: bash
        run: |
          tag="${{ inputs.tag }}"
          [ -z "$tag" ] && tag="$GITHUB_REF_NAME"
          name="${BIN_NAME}-${tag}-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/${BIN_NAME}" "$name/"
          cp README.md LICENSE config.yaml "$name/"
          tar -czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"
          echo "ASSET_SHA=$name.tar.gz.sha256" >> "$GITHUB_ENV"

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            ${{ env.ASSET }}
            ${{ env.ASSET_SHA }}
