# responses-proxy configuration.
#
# This project currently loads YAML, not TOML. Pass a different file with:
#   responses-proxy --config /path/to/config.yaml

# ── Server ─────────────────────────────────────────────────────────────
server:
  # Address and port the proxy listens on.
  # Optional. Default: "0.0.0.0:3000".
  listen: "0.0.0.0:3000"

  # Default request timeout in seconds.
  # Used when a model provider does not set provider.timeout.
  # Optional. Default: 600.
  timeout: 600

  # Log level: trace | debug | info | warn | error.
  # Can be overridden by RUST_LOG.
  # Optional. Default: info.
  log-level: info

  # AES-256-GCM key for compact summary encryption (64 hex chars = 32 bytes).
  # Used by compaction flows when encrypted compaction payloads are present.
  # Empty string disables decryption/encryption support.
  # Optional. Default: "".
  compact-encryption-key: "9db1ce5a9266c866e56073c590fae9b99b2d8385f19768736bf4c5bc75fb274d"

  # API key authentication. If at least one key is present, auth is enabled.
  # When enabled, authenticated endpoints require:
  #   Authorization: Bearer <one of these keys>
  # /health remains open.
  # Optional. Default: [] (auth disabled).
  auth:
    keys: []
    # Example:
    # keys:
    #   - sk-your-secret-key-here

  # CORS allow origins.
  # Empty list means allow any origin.
  # Optional. Default: [].
  cors:
    allow-origins: []
    # Example:
    # allow-origins:
    #   - http://localhost:5173
    #   - https://example.com

  # Allowed tool types for Responses tools accepted by the converter.
  # Unsupported or disallowed tool types are rejected/dropped at conversion boundaries.
  # Chat-compatible types currently include function/custom conversion paths.
  # Optional. Default: ["function"].
  allowed-tool-types:
    - function
    # - custom

# ── Models ─────────────────────────────────────────────────────────────
# Each key under models is the model name exposed by this proxy.
# The optional "model" field is the downstream provider model name.
models:
  gpt-5.5:
    # Downstream model name sent to the Chat Completions provider.
    # Optional. Defaults to this map key ("gpt-5.5").
    model: deepseek-v4-pro

    # Optional provider-specific JSON rewrites. This can be either an inline
    # rewrite profile like the example below, or the name of a top-level
    # reusable profile under "rewrites", for example: rewrite: deepseek.
    #
    # Public request/response
    # bodies are first parsed as OpenAI-compatible typed structs; rewrites
    # are only provider-compatibility patches at fixed pipeline stages:
    # - response-in: parsed Responses request JSON before Responses -> Chat
    # - chat-out: converted Chat request JSON before sending upstream
    # - chat-in: upstream Chat response JSON before converting to Responses
    # - response-out: final Responses response JSON before returning
    # Rewrite operations are chained and run in the same order they are listed
    # in each stage. Later rules see changes made by earlier rules, so put
    # more specific matches before broader matches when they touch the same path.
    # Paths can be plain field names, dotted paths, or JSON pointers.
    # Examples:
    # - model                       # plain field name
    # - reasoning.effort            # dotted path
    # - choices.0.finish_reason     # dotted path with an array index
    # - /response_format/type       # JSON pointer
    # - /tools/0/function/name      # JSON pointer with an array index
    #
    # Operations:
    # - reset: overwrite a path only when the target path already exists
    # - rename: move one path to another path
    # - remove: delete paths
    # - replace: if current value matches "if", write set to the current
    #   replace key, then write each optional with entry
    #   With is an ordered map of target path -> JSON value. Use "" as a
    #   with key to replace the whole body. A with entry can target any path,
    #   including "model", so a single rule can both clamp a field and route the
    #   request to a different upstream model (see the reasoning example below).
    #   String "if" values are regex patterns. Use ^...$ for exact matches.
    #
    # The commented example below shows common provider compatibility rewrites.
    # rewrite:
    #   - at: response-in
    #     reset:
    #       max_output_tokens: 2048
    #     replace:
    #       reasoning.effort:
    #         - if: none
    #           set: null
    #   - at: chat-out
    #     rename:
    #       max_completion_tokens: max_tokens
    #     replace:
    #       reasoning_effort:
    #         - if: "^(high|xhigh)$"
    #           set: max
    #           with:
    #             # Route the highest reasoning tiers to a stronger upstream
    #             # model in the same rule that clamps the effort value.
    #             model: provider/model-pro
    #             thinking:
    #               type: enable
    #         - if: "^(minimal|low|medium)$"
    #           set: high
    #           with:
    #             provider_options.reasoning:
    #               enabled: true
    #               budget: 4096
    #   - at: chat-in
    #     remove:
    #       - system_fingerprint
    #     replace:
    #       choices.0.finish_reason:
    #         - if: length
    #           set: stop
    #   - at: response-out
    #     remove:
    #       - parallel_tool_calls
    #     replace:
    #       service_tier:
    #         - if: auto
    #           set: priority
    #         - if: priority
    #           set: default
    provider:
      # API key for the downstream provider.
      # Values beginning with "$" are read from the environment.
      # Required.
      api-key: $DEEPSEEK_API_KEY

      # Chat Completions compatible base URL.
      # The proxy sends requests to: {base-url}/chat/completions
      # Required.
      base-url: https://api.deepseek.com

      # Per-provider timeout in seconds.
      # Optional. Falls back to server.timeout.
      timeout: 60

    # Per-model history controls.
    # Optional. Omit the whole block to accept the defaults.
    history:
      # Total character ceiling for the converted Chat request. When replayed
      # history exceeds it, the oldest tool outputs are truncated until it fits.
      # Acts as a backstop; keep it above the compaction point (see
      # context-window) so Codex compacts before the proxy has to truncate.
      # Optional. Default: unlimited.
      # max-input-chars: 1500000

      # Maximum number of messages in the converted Chat request.
      # Optional. Default: 1000.
      # max-input-messages: 1000

      # Context window (tokens) advertised to Codex via /v1/models. Codex keys
      # its client-side auto-compaction off this size (it compacts at ~90% of
      # it). Setting this OVERRIDES whatever the upstream advertises; leaving it
      # unset trusts the upstream's own context length, and if the upstream
      # doesn't report one, Codex falls back to its bundled default.
      # Optional. Default: trust the upstream.
      # context-window: 400000

    # Reasoning tiers advertised to Codex via /v1/models. Codex builds its
    # `/model` picker verbatim from this ordered list (recent versions no longer
    # infer the other built-in tiers themselves), so a model that advertises only
    # one tier shows only that tier. The order given here is the order shown.
    # Omit this block to advertise the built-in default:
    #   levels:  low, medium, high, xhigh, max, ultra
    #   default: medium
    #
    # WARNING: that default list includes xhigh/max/ultra. A plain Chat
    # Completions upstream rejects tiers it does not support (max/ultra typically
    # exist only on a provider's /v1/messages endpoint). If yours does not accept
    # them, either narrow "levels" to what it supports, or clamp max/ultra down
    # with a rewrite (see the reasoning_effort example above).
    # reasoning:
    #   # Tier the picker selects by default.
    #   default: medium
    #   # Ordered tiers to advertise; order is preserved in the picker.
    #   levels:
    #     - low
    #     - medium
    #     - high
    #     - xhigh

  codex-auto-review:
    # Example of exposing another logical model backed by a different
    # downstream model on the same provider.
    model: deepseek-v4-flash
    # If the upstream 500s on `stream: true` + a structured `response_format`,
    # set this to false and the proxy buffers a non-streamed reply and replays
    # it as SSE. Defaults to true (stream through unchanged).
    # stream-structured-output: true
    provider:
      api-key: $DEEPSEEK_API_KEY
      base-url: https://api.deepseek.com

# Optional reusable rewrite profiles. Models can reference one by name with:
# rewrite: deepseek
#
# rewrites:
#   deepseek:
#     at: chat-out
#     rename:
#       max_completion_tokens: max_tokens
